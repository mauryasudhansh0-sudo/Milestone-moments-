<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>milestone memories</title>
    
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide-react"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ff8fa3;
            --bg: #fff5f7;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            overflow-x: hidden;
        }

        .romantic-font { font-family: 'Dancing Script', cursive; }
        .elegant-font { font-family: 'Playfair Display', serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* Floating Hearts Animation */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = FramerMotion;
        const { Heart, Edit2, Share2, Plus, Trash2, Save, Music, Image, Calendar, Type, Settings, ChevronRight, Lock, Eye, Layout } = LucideReact;

        // --- CONFIGURATION ---
        const SUPABASE_URL = 'https://iaueleylurcspbzjquai.supabase.co.'; // Replace me
        const SUPABASE_ANON_KEY = 'sb_publishable_NAoWD47SN1qeYnzjzVhzbQ_U-0_de53'; // Replace me
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- THEMES ---
        const THEMES = {
            romantic: { primary: '#ff4d6d', secondary: '#ff8fa3', bg: '#fff5f7', font: 'Dancing Script' },
            midnight: { primary: '#e94560', secondary: '#0f3460', bg: '#1a1a2e', font: 'Playfair Display' },
            vintage: { primary: '#8b5e3c', secondary: '#d4a373', bg: '#fefae0', font: 'Playfair Display' },
            birthday: { primary: '#00b4d8', secondary: '#90e0ef', bg: '#caf0f8', font: 'Poppins' }
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [view, setView] = useState('home'); // home, builder, dashboard, viewer
            const [user, setUser] = useState(null);
            const [activeProject, setActiveProject] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                // Check for Project ID in URL (Deep Linking)
                const params = new URLSearchParams(window.location.search);
                const projectId = params.get('p');
                if (projectId) {
                    loadProjectForView(projectId);
                }

                // Auth Listener
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                });
            }, []);

            const loadProjectForView = async (id) => {
                setLoading(true);
                const { data, error } = await supabase
                    .from('projects')
                    .select('*')
                    .eq('id', id)
                    .single();
                
                if (data) {
                    setActiveProject(data);
                    setView('viewer');
                }
                setLoading(false);
            };

            const navigateToBuilder = (project = null) => {
                setActiveProject(project || {
                    project_name: "My Creation",
                    recipient_name: "Love",
                    theme: "romantic",
                    letter: "Write your heart out...",
                    memories: [],
                    timeline: [],
                    stickers: []
                });
                setView('builder');
            };

            return (
                <div className="min-h-screen">
                    <AnimatePresence mode="wait">
                        {view === 'home' && <HomeView key="home" onStart={() => setView('dashboard')} />}
                        {view === 'dashboard' && <DashboardView key="dash" onEdit={navigateToBuilder} onView={loadProjectForView} />}
                        {view === 'builder' && <BuilderView key="build" initialData={activeProject} onExit={() => setView('dashboard')} />}
                        {view === 'viewer' && <ProjectViewer key="view" project={activeProject} onExit={() => setView('home')} />}
                    </AnimatePresence>
                    <FloatingHearts />
                </div>
            );
        };

        // --- SUB-VIEWS ---

        const HomeView = ({ onStart }) => (
            <motion.div 
                initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                className="flex flex-col items-center justify-center min-h-screen text-center p-6"
            >
                <div className="mb-6 bg-white p-4 rounded-full shadow-xl">
                    <Heart size={64} className="text-pink-500 fill-pink-500 animate-pulse" />
                </div>
                <h1 className="text-6xl font-bold text-gray-800 romantic-font mb-4">Create Magic for Your Loved Ones</h1>
                <p className="text-xl text-gray-600 max-w-lg mb-8">Build beautiful, personalized websites for anniversaries, birthdays, or just because. Persistent, shareable, and forever.</p>
                <button 
                    onClick={onStart}
                    className="bg-pink-500 hover:bg-pink-600 text-white px-10 py-4 rounded-full text-xl font-bold shadow-lg transition-transform hover:scale-105"
                >
                    Start Creating
                </button>
            </motion.div>
        );

        const DashboardView = ({ onEdit, onView }) => {
            const [projects, setProjects] = useState([]);
            useEffect(() => {
                const fetch = async () => {
                    const { data } = await supabase.from('projects').select('*').order('created_at', { ascending: false });
                    setProjects(data || []);
                };
                fetch();
            }, []);

            return (
                <div className="p-8 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-10">
                        <h2 className="text-4xl font-bold text-gray-800 romantic-font">My Creations</h2>
                        <button onClick={() => onEdit()} className="flex items-center gap-2 bg-pink-500 text-white px-6 py-2 rounded-full">
                            <Plus size={20}/> New Project
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {projects.map(p => (
                            <div key={p.id} className="glass-card p-6 rounded-3xl shadow-sm hover:shadow-xl transition-all group">
                                <div className="h-32 rounded-2xl mb-4" style={{ backgroundColor: THEMES[p.theme || 'romantic'].primary }}></div>
                                <h3 className="text-xl font-bold mb-1">{p.project_name}</h3>
                                <p className="text-gray-500 text-sm mb-4">Recipient: {p.recipient_name}</p>
                                <div className="flex gap-2">
                                    <button onClick={() => onEdit(p)} className="p-2 bg-gray-100 rounded-lg hover:bg-pink-100 text-pink-500 transition-colors">
                                        <Edit2 size={18} />
                                    </button>
                                    <button onClick={() => onView(p.id)} className="p-2 bg-gray-100 rounded-lg hover:bg-blue-100 text-blue-500 transition-colors">
                                        <Eye size={18} />
                                    </button>
                                    <button onClick={() => {
                                        const url = `${window.location.origin}${window.location.pathname}?p=${p.id}`;
                                        navigator.clipboard.writeText(url);
                                        alert("Link copied!");
                                    }} className="p-2 bg-gray-100 rounded-lg hover:bg-green-100 text-green-500 transition-colors">
                                        <Share2 size={18} />
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const BuilderView = ({ initialData, onExit }) => {
            const [project, setProject] = useState(initialData);
            const [activeTab, setActiveTab] = useState('info');

            const handleSave = async () => {
                const { data, error } = await supabase
                    .from('projects')
                    .upsert({ ...project, updated_at: new Date() })
                    .select()
                    .single();
                if (data) {
                    setProject(data);
                    alert("Project Saved Securely!");
                }
            };

            return (
                <div className="flex h-screen bg-gray-50">
                    {/* Sidebar Controls */}
                    <div className="w-80 bg-white border-r overflow-y-auto p-6 flex flex-col gap-6">
                        <div className="flex items-center gap-2 mb-4">
                            <button onClick={onExit} className="text-gray-400 hover:text-black"><ChevronRight className="rotate-180" /></button>
                            <h2 className="font-bold text-xl">Editor</h2>
                        </div>

                        <nav className="flex flex-col gap-2">
                            <SidebarTab active={activeTab === 'info'} onClick={() => setActiveTab('info')} icon={<Type />} label="Basic Info" />
                            <SidebarTab active={activeTab === 'theme'} onClick={() => setActiveTab('theme')} icon={<Layout />} label="Themes" />
                            <SidebarTab active={activeTab === 'letter'} onClick={() => setActiveTab('letter')} icon={<Edit2 />} label="Letter" />
                            <SidebarTab active={activeTab === 'gallery'} onClick={() => setActiveTab('gallery')} icon={<Image />} label="Memories" />
                        </nav>

                        <div className="mt-auto pt-6 border-t flex flex-col gap-3">
                            <button onClick={handleSave} className="w-full bg-pink-500 text-white py-3 rounded-xl flex justify-center gap-2 font-bold shadow-lg shadow-pink-200">
                                <Save size={20} /> Save Changes
                            </button>
                        </div>
                    </div>

                    {/* Preview Area */}
                    <div className="flex-1 overflow-y-auto p-12 flex justify-center bg-gray-200">
                        <div className="w-full max-w-2xl bg-white shadow-2xl rounded-[3rem] overflow-hidden min-h-[800px] relative">
                             {activeTab === 'info' && (
                                <div className="p-10">
                                    <label className="block text-sm font-bold text-gray-400 mb-2 uppercase">Recipient Name</label>
                                    <input 
                                        className="text-4xl romantic-font w-full border-b border-pink-100 focus:outline-none mb-8"
                                        value={project.recipient_name}
                                        onChange={e => setProject({...project, recipient_name: e.target.value})}
                                    />
                                    <label className="block text-sm font-bold text-gray-400 mb-2 uppercase">Project Name</label>
                                    <input 
                                        className="text-xl w-full border-b border-gray-100 focus:outline-none"
                                        value={project.project_name}
                                        onChange={e => setProject({...project, project_name: e.target.value})}
                                    />
                                </div>
                             )}
                             
                             {activeTab === 'theme' && (
                                <div className="p-10 grid grid-cols-2 gap-4">
                                    {Object.keys(THEMES).map(t => (
                                        <button 
                                            key={t}
                                            onClick={() => setProject({...project, theme: t})}
                                            className={`p-4 rounded-2xl border-2 transition-all ${project.theme === t ? 'border-pink-500 bg-pink-50' : 'border-gray-100'}`}
                                        >
                                            <div className="h-10 rounded-full mb-2" style={{ backgroundColor: THEMES[t].primary }}></div>
                                            <span className="capitalize font-bold">{t}</span>
                                        </button>
                                    ))}
                                </div>
                             )}

                             {activeTab === 'letter' && (
                                <div className="p-10 h-full">
                                     <textarea 
                                        className="w-full h-[500px] romantic-font text-2xl leading-relaxed p-6 bg-pink-50 rounded-3xl focus:outline-none"
                                        value={project.letter}
                                        onChange={e => setProject({...project, letter: e.target.value})}
                                    />
                                </div>
                             )}
                        </div>
                    </div>
                </div>
            );
        };

        const ProjectViewer = ({ project }) => {
            const theme = THEMES[project.theme || 'romantic'];
            
            return (
                <motion.div 
                    initial={{ opacity: 0 }} animate={{ opacity: 1 }}
                    style={{ backgroundColor: theme.bg }}
                    className="min-h-screen py-20 px-6 flex flex-col items-center"
                >
                    <div className="max-w-3xl w-full text-center">
                        <motion.h1 
                            initial={{ y: 20 }} animate={{ y: 0 }}
                            className="text-7xl romantic-font mb-12"
                            style={{ color: theme.primary }}
                        >
                            For {project.recipient_name}
                        </motion.h1>
                        
                        <div className="glass-card p-12 rounded-[4rem] shadow-2xl text-left mb-20">
                            <p className="text-3xl romantic-font leading-loose whitespace-pre-wrap text-gray-800">
                                {project.letter}
                            </p>
                        </div>

                        <footer className="text-gray-400 font-light tracking-widest uppercase text-sm">
                            Created with ❤️ by {project.creator_name || 'Me'}
                        </footer>
                    </div>
                </motion.div>
            );
        };

        // --- HELPER COMPONENTS ---

        const SidebarTab = ({ active, onClick, icon, label }) => (
            <button 
                onClick={onClick}
                className={`flex items-center gap-4 px-4 py-3 rounded-xl transition-all ${active ? 'bg-pink-50 text-pink-500 shadow-sm' : 'text-gray-500 hover:bg-gray-50'}`}
            >
                {React.cloneElement(icon, { size: 20 })}
                <span className="font-semibold">{label}</span>
            </button>
        );

        const FloatingHearts = () => {
            const [hearts, setHearts] = useState([]);
            useEffect(() => {
                const interval = setInterval(() => {
                    setHearts(prev => [...prev, { id: Date.now(), left: Math.random() * 100 }]);
                    setTimeout(() => setHearts(prev => prev.slice(1)), 6000);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            return hearts.map(h => (
                <div key={h.id} className="heart-particle text-pink-400" style={{ left: `${h.left}%` }}>
                    <Heart size={Math.random() * 20 + 10} fill="currentColor" />
                </div>
            ));
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
